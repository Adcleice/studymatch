name: Forum public discovery patch
on:
  push:
    paths:
      - '.github/workflows/forum-public-discovery-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Forum publishing flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Forum.jsx')
          s=p.read_text()
          old="[mediaFile,setMediaFile]=useState(null),[mediaPreview,setMediaPreview]=useState('');"
          new="[mediaFile,setMediaFile]=useState(null),[mediaPreview,setMediaPreview]=useState(''),[publicDiscovery,setPublicDiscovery]=useState(false);"
          assert old in s
          s=s.replace(old,new,1)
          old="post_type:postType,keywords,media_url:media.url,media_type:media.type}"
          new="post_type:postType,keywords,media_url:media.url,media_type:media.type,public_discovery:publicDiscovery}"
          assert old in s
          s=s.replace(old,new,1)
          old="setPostType('Discussão');setKeywordsText('');clearMedia();await load()"
          new="setPostType('Discussão');setKeywordsText('');setPublicDiscovery(false);clearMedia();await load()"
          assert old in s
          s=s.replace(old,new,1)
          anchor="{error&&<div style={s.modalError}>{error}</div>}<button className=\"btn-primary\" disabled={publishing} onClick={publish}>"
          insert="<label style={s.publicDiscovery}><input type=\"checkbox\" checked={publicDiscovery} onChange={e=>setPublicDiscovery(e.target.checked)}/><span><b>Permitir que esta publicação seja encontrada fora do Matchworking</b><small>Se ativado, título, texto, mídia e seu nome público poderão aparecer em mecanismos de busca e links públicos.</small></span></label>{error&&<div style={s.modalError}>{error}</div>}<button className=\"btn-primary\" disabled={publishing} onClick={publish}>"
          assert anchor in s
          s=s.replace(anchor,insert,1)
          old="modalError:{background:'#FDEBEC',color:'#B42332',padding:9,borderRadius:10,fontSize:11}};"
          new="publicDiscovery:{display:'grid',gridTemplateColumns:'22px 1fr',gap:9,alignItems:'start',padding:12,border:'1px solid #CFE2DC',borderRadius:12,background:'#F2F8F6',color:'#153C52',fontSize:11},modalError:{background:'#FDEBEC',color:'#B42332',padding:9,borderRadius:10,fontSize:11}};"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Forum.jsx
          git commit -m "Add opt-in public discovery to forum publishing"
          git push
