name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore stable beta signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: studymatch-beta-debug-keystore-v1

      - name: Ensure beta signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=StudyMatch Beta,O=StudyMatch,C=BR"
          fi

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor Android
        run: npm install --no-save @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply official StudyMatch launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d public/studymatch-logo-data.txt > android/app/src/main/res/drawable-nodpi/studymatch_icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          text=text.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/studymatch_icon"')
          text=text.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/studymatch_icon"')
          p.write_text(text)
          PY

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../StudyMatch.apk

      - name: Publish stable APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-beta >/dev/null 2>&1; then
            gh release upload android-beta StudyMatch.apk --clobber
          else
            gh release create android-beta StudyMatch.apk --title "StudyMatch para Android" --notes "Versão beta instalável diretamente no Android."
          fi
