name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Restore stable beta signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: studymatch-beta-debug-keystore-v1
      - name: Ensure beta signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Matchworking Beta,O=Matchworking,C=BR"
          fi
      - name: Install web dependencies
        run: npm ci
      - name: Install Capacitor Android
        run: npm install --no-save @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2
      - name: Build web fallback
        run: npm run build
      - name: Stamp installed APK build in native start URL
        run: |
          python3 - <<'PY'
          import json, os
          p='capacitor.config.json'
          c=json.load(open(p))
          base=c['server']['url'].split('?')[0]
          c['server']['url']=f"{base}?apkBuild={os.environ['GITHUB_RUN_NUMBER']}"
          json.dump(c,open(p,'w'),ensure_ascii=False,indent=2)
          PY
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Set Android version for in-place updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('android/app/build.gradle')
          t=p.read_text()
          n=int(os.environ['GITHUB_RUN_NUMBER'])
          t=re.sub(r'versionCode\s+\d+',f'versionCode {n}',t)
          t=re.sub(r'versionName\s+"[^"]+"',f'versionName "0.0.{n}"',t)
          p.write_text(t)
          PY
      - name: Render official Matchworking asset for Android
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p android/app/src/main/res/drawable-nodpi
          rsvg-convert -w 390 public/studymatch-mark.svg -o /tmp/matchworking_mark.png
          convert -size 512x512 xc:none \
            -fill '#082A55' -draw 'roundrectangle 12,12 500,500 92,92' \
            /tmp/matchworking_mark.png -gravity center -composite \
            android/app/src/main/res/drawable-nodpi/matchworking_icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          text=text.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/matchworking_icon"')
          text=text.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/matchworking_icon"')
          p.write_text(text)
          PY
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Matchworking.apk
      - name: Publish stable APK download and version metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build: $GITHUB_RUN_NUMBER\n\nAtualização instalável sobre a versão anterior, sem precisar desinstalar o app."
          if gh release view android-beta >/dev/null 2>&1; then
            gh release upload android-beta Matchworking.apk --clobber
            gh release edit android-beta --title "Matchworking para Android — build $GITHUB_RUN_NUMBER" --notes "$NOTES"
          else
            gh release create android-beta Matchworking.apk --title "Matchworking para Android — build $GITHUB_RUN_NUMBER" --notes "$NOTES"
          fi
