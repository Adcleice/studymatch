name: MVP Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch React Router lockfile
        run: npm install react-router-dom@^7.18.2 --package-lock-only
      - name: Upload patched lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
